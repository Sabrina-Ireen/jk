<div class="min-h-screen p-8">
  <div class="mb-10">
    <h1 class="text-4xl font-serif font-bold text-gray-900">
      Admin <span class="text-[#FF7D54]">Dashboard</span>
    </h1>
    <p class="text-gray-500 mt-2">Real-time overview of Harmony Haven platform metrics.</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    
    <div class="bg-white p-8 rounded-[2rem] border border-gray-100 shadow-sm hover:shadow-md transition">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Total </p>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest"> Doctors</p>
         <h2 class="text-4xl font-bold mt-2 text-gray-900">
  {{ counts?.totalDoctors ?? 0 }}
</h2>
        </div>
        <span class="text-2xl">👨‍⚕️</span>
      </div>
    </div>

     <div class="bg-white p-8 rounded-[2rem] border border-gray-100 shadow-sm hover:shadow-md transition">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest"> Total</p>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest"> Patients</p>
         <h2 class="text-4xl font-bold mt-2 text-gray-900">
  {{ counts?.totalPatients ?? 0 }}
</h2>
        </div>
        <span class="text-2xl">👤</span>
      </div>
    </div>

    <div class="bg-white p-8 rounded-[2rem] border border-gray-100 shadow-sm hover:shadow-md transition">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest"> Total</p>
           <p class="text-xs font-bold text-gray-400 uppercase tracking-widest"> Appointments</p>
         <h2 class="text-4xl font-bold mt-2 text-gray-900">
  {{ counts?.totalAppointments ?? 0 }}
</h2>
        </div>
        <span class="text-2xl">📅</span>
      </div>
    </div>

    <div class="bg-white p-8 rounded-[2rem] border border-gray-100 shadow-sm hover:shadow-md transition">
      <div class="flex justify-between items-start">
        <div>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest"> Total</p>
          <p class="text-xs font-bold text-gray-400 uppercase tracking-widest"> Schedules</p>
          
          <h2 class="text-4xl font-bold mt-2 text-gray-900">
  {{ counts?.totalSchedules ?? 0 }}
</h2>
        </div>
        <span class="text-2xl">⏰</span>  <!-- Alarm clock emoji -->

      </div>
    </div>
  </div>


</div>
