<div class="min-h-screen bg-[#FDFBF7] flex items-center justify-center p-6">
  <div class="max-w-xl w-full bg-white p-8 rounded-2xl shadow-lg border border-gray-200">

    <!-- Title -->
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">
      Mental Health Quiz
    </h2>

    <!-- Progress -->
    <p class="text-gray-500 text-center mb-6">
      Question {{ currentStep + 1 }} of {{ questions.length }}
    </p>

    <!-- Question -->
    <div class="mb-6">
      <p class="text-lg font-medium text-gray-700 text-center">
        {{ questions[currentStep].question }}
      </p>
    </div>

    <!-- Options -->
    <div class="flex flex-col space-y-3 mb-6">
      <label *ngFor="let option of questions[currentStep].options" 
             class="flex items-center p-3 border rounded-xl hover:bg-[#FFFAF0] cursor-pointer transition shadow-sm">
        <input type="radio"
               name="option"
               [value]="option.text"
               [(ngModel)]="questions[currentStep].answerText"
               (change)="onOptionSelect()"
               class="mr-3 h-5 w-5 text-[#FF7D54] focus:ring-[#FF7D54] border-gray-300" />
        <span class="text-gray-700 font-medium">{{ option.text }}</span>
      </label>
    </div>

    <!-- Navigation Buttons -->
    <div class="flex justify-between">
      <button (click)="previous()" 
              [disabled]="currentStep === 0"
              class="px-4 py-2 rounded-xl bg-gray-200 text-gray-700 hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed transition">
        Previous
      </button>
      <button (click)="next()" 
              [disabled]="!questions[currentStep].answerText"
              class="px-4 py-2 rounded-xl bg-[#FF7D54] text-white hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed transition">
        {{ currentStep === questions.length - 1 ? 'Submit' : 'Next' }}
      </button>
    </div>

  </div>
</div>
