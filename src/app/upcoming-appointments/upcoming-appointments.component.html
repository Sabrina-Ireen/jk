<div class="min-h-screen bg-gray-100 p-8 flex items-center justify-center">

    <div class="w-full max-w-2xl bg-white p-8 rounded-xl shadow-lg space-y-6">

        <div class="flex items-center justify-between border-b pb-4">
            <h2 class="text-2xl font-bold text-gray-700">My Appointments</h2>
            <button (click)="goBack()"
                class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-300">
                Back
            </button>
        </div>

        <div *ngIf="appointments.length === 0" class="text-center py-10">
            <p class="text-gray-500">No appointments found.</p>
        </div>

        <div *ngIf="appointments.length > 0" class="space-y-4">
            <div *ngFor="let app of appointments" class="p-4 border rounded-lg hover:bg-gray-50 transition">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-lg font-bold text-gray-800">{{ app.doctorName }}</p>
                        <p class="text-gray-600">{{ app.appointmentDate | date:'dd MMM yyyy' }} at
                            {{ app.slotTime }}</p>
                        <span class="inline-block mt-2 text-xs px-2 py-1 rounded font-bold uppercase" [ngClass]="{
                                'bg-orange-100 text-orange-600': app.status === 'Pending',
                                'bg-green-100 text-green-600': app.status === 'Scheduled',
                                'bg-blue-100 text-blue-600': app.status === 'Completed',
                                'bg-red-100 text-red-600': app.status === 'Cancelled'
                            }">
                            {{ app.status }}
                        </span>
                        <div *ngIf="app.status === 'Completed'" class="mt-3">
                            <button (click)="viewPrescription(app.appointmentId)"
                                class="text-orange-500 font-bold hover:underline flex items-center gap-1">
                                💊 View Prescription
                            </button>
                        </div>
                    </div>
                    <div *ngIf="app.sessionLink" class="text-right">
                        <button (click)="joinSession(app.sessionLink)"
                            class="bg-orange-500 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm hover:bg-orange-600">
                            Join Session
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>
