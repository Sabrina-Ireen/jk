<div class="min-h-screen bg-[#FDFBF7] flex items-center justify-center p-6">
  <div class="bg-white p-10 rounded-2xl shadow-lg w-full max-w-lg text-center">

    <h2 class="text-2xl font-bold mb-4 text-gray-800">
      AI Quiz Result
    </h2>

    <p class="text-gray-600 mb-2">
      Based on your answers, we recommend:
    </p>

    <div class="text-xl font-semibold text-[#FF7D54] mb-6">
      {{ category }}
    </div>

    <button
      (click)="goToDoctors()"
      class="w-full py-3 bg-[#FF7D54] text-white rounded-xl font-semibold hover:opacity-90 transition">
      Find a Doctor
    </button>

  </div>
</div>
