<div class="p-6 space-y-4 min-h-screen">

  <h1 class="text-3xl font-bold mb-4">Specializations</h1>

  <!-- Add button -->
  <div class="flex justify-end mb-4">
    <button (click)="openAddSpecializationForm()" class="bg-[#FF7D54] text-white px-4 py-2 rounded-2xl hover:bg-[#e66a45] transition">
      + Add Specialization
    </button>
  </div>

  <!-- Specializations Table -->
  <div class="overflow-x-auto bg-white shadow rounded-lg">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-2 text-left text-gray-500 uppercase">ID</th>
          <th class="px-4 py-2 text-left text-gray-500 uppercase">Name</th>
          <th class="px-4 py-2 text-left text-gray-500 uppercase">Actions</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        <tr *ngFor="let spec of specializations">
          <td class="px-4 py-2">{{ spec.id }}</td>
          <td class="px-4 py-2">{{ spec.name }}</td>
          <td class="px-4 py-2 space-x-2">
            <button (click)="openEditSpecializationForm(spec)" class="px-3 py-1 rounded bg-blue-500 text-white hover:bg-blue-600">Edit</button>
            <button (click)="deleteSpecialization(spec.id)" class="px-3 py-1 rounded bg-red-500 text-white hover:bg-red-600">Delete</button>
          </td>
        </tr>
        <tr *ngIf="specializations.length === 0">
          <td colspan="3" class="py-6 text-center text-gray-400 italic">No specializations available</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Add Specialization Modal -->
  <div *ngIf="showAddSpecializationModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
    <div class="bg-white p-6 rounded-lg w-96 space-y-4">
      <h2 class="text-xl font-bold">Add Specialization</h2>
      <input [(ngModel)]="newSpecialization.name" placeholder="Specialization Name" class="w-full border p-2 rounded"/>
      <div class="flex justify-end space-x-2">
        <button (click)="closeModal()" class="px-4 py-2 rounded bg-gray-300">Cancel</button>
        <button (click)="addSpecialization()" class="px-4 py-2 rounded bg-[#FF7D54] text-white">Add</button>
      </div>
    </div>
  </div>

  <!-- Edit Specialization Modal -->
  <div *ngIf="showEditSpecializationModal" class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
    <div class="bg-white p-6 rounded-lg w-96 space-y-4">
      <h2 class="text-xl font-bold">Edit Specialization</h2>
      <input [(ngModel)]="editSpecialization.name" placeholder="Specialization Name" class="w-full border p-2 rounded"/>
      <div class="flex justify-end space-x-2">
        <button (click)="closeModal()" class="px-4 py-2 rounded bg-gray-300">Cancel</button>
        <button (click)="updateSpecialization()" class="px-4 py-2 rounded bg-blue-500 text-white">Update</button>
      </div>
    </div>
  </div>

</div>
